name: Update data (notebook)

on:
  schedule:
    - cron: "0 14 * * *"   # daily at 14:00 UTC
  workflow_dispatch: {}

concurrency:
  group: update-data
  cancel-in-progress: true

jobs:
  run-notebook:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write

    env:
      # Use the same secret you already created
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      # Expose both names so notebooks that read either one will work
      GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: List files (debug)
        run: |
          pwd
          ls -R

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install papermill jupyter nbconvert nbclient ipykernel \
                      pandas numpy python-dotenv requests \
                      vaderSentiment nltk openpyxl

      - name: Register kernel for papermill
        run: |
          python -m ipykernel install --user --name python3

      - name: Download NLTK resources (VADER)
        run: |
          python - << 'PY'
          import nltk
          try:
            nltk.download('vader_lexicon', quiet=True)
          except Exception:
            pass
          PY

      - name: Create .env in data/final
        working-directory: data/final
        run: |
          echo "GOOGLE_MAPS_API_KEY=${GOOGLE_MAPS_API_KEY}" > .env
          echo "GOOGLE_API_KEY=${GOOGLE_API_KEY}" >> .env
          awk -F= '{print $1"=<set>"}' .env

      - name: Prepare processed fallbacks from frozen data
        run: |
          set -e
          mkdir -p data/processed

          # If final places exist, make basic/details fallbacks the notebook expects
          if [ -f "data/final/places.csv" ]; then
            python - << 'PY'
            import pandas as pd
            from pathlib import Path
            final_places = Path("data/final/places.csv")
            final_reviews = Path("data/final/reviews.csv")
            proc_dir = Path("data/processed")
            proc_dir.mkdir(parents=True, exist_ok=True)

          if final_places.exists():
          df = pd.read_csv(final_places)
          basic_cols_order = [
          "place_id","name","lat","lng","address",
          "google_types","rating","user_ratings_total","category","source_category"
          ]
          keep = [c for c in basic_cols_order if c in df.columns]
          df[keep].to_csv(proc_dir/"auckland_places_basic.csv", index=False)

          df.to_csv(proc_dir/"auckland_places_details.csv", index=False)

          if final_reviews.exists():
          pd.read_csv(final_reviews).to_csv(proc_dir/"auckland_reviews.csv", index=False)
          PY
          else
            echo "data/final/places.csv not found; skipping seeding."
          fi

          # Show what we have now
          ls -lh data/processed || true

      
      - name: Run notebook (Data collection)
        working-directory: data/final
        run: |
          test -f "data_collection_final.ipynb" || (echo "data_collection_final.ipynb not found in data/final/" && exit 1)
          papermill --log-output -k python3 "data_collection_final.ipynb" "_out_data_collection.ipynb"

      # --- Then run sentiment ---
      - name: Run sentiment notebook
        working-directory: data/final
        run: |
          test -f "Sent.ipynb" || (echo "Sent.ipynb not found in data/final/" && exit 1)
          papermill --log-output -k python3 "Sent.ipynb" "_out_sent.ipynb"

      - name: Show outputs (debug)
        run: |
          ls -lh data/final

      - name: Upload executed notebooks (artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: executed-notebooks
          path: |
            data/final/_out_data_collection.ipynb
            data/final/_out_sent.ipynb
          if-no-files-found: ignore

      - name: Commit updated data (if changed)
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data/final/* || true
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "auto: refresh data $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            git push || true
          fi
