name: Update data (sentiment)

on:
  schedule:
    - cron: "0 14 * * *"   
  workflow_dispatch: {}

jobs:
  run-notebook:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    env:
      
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: List repo (debug)
        run: |
          pwd
          ls -R

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install papermill jupyter nbconvert nbclient ipykernel \
                      pandas numpy python-dotenv requests \
                      vaderSentiment nltk openpyxl

      - name: Register kernel for papermill
        run: |
          python -m ipykernel install --user --name python3

      - name: Download NLTK resources (VADER)
        run: |
          python - << 'PY'
          import nltk
          nltk.download('vader_lexicon', quiet=True)
          PY

      - name: Run data collection notebook (optional)
        if: ${{ hashFiles('data/final/data_collection_final.ipynb') != '' }}
        run: |
          papermill --log-output -k python3 \
            "data/final/data_collection_final.ipynb" \
            "data/final/_out_data_collection.ipynb"

      - name: Run sentiment notebook
        run: |
          papermill --log-output -k python3 \
            "data/final/Sent.ipynb" \
            "data/final/_out_sent.ipynb"

      - name: Show outputs (debug)
        run: |
          ls -lh data/final

      - name: Commit updated data (if changed)
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add data/final/* || true
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "auto: refresh data $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            git push
          fi
