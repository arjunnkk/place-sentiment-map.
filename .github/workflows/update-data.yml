name: Update data (notebook)

on:
  schedule:
    # Runs daily at 14:00 UTC (~02:00–03:00 NZ time depending on DST)
    - cron: "0 14 * * *"
  workflow_dispatch: {}   # lets you run it manually from the Actions tab

jobs:
  run-notebook:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # allow pushing updated CSV/JSON
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: List files (debug)
        run: |
          pwd
          ls -R

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install papermill jupyter pandas numpy python-dotenv openpyxl requests

      - name: Configure secrets (used inside notebook)
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: echo "Secrets available to the notebook via environment variables."

      - name: Run notebook (Data collection)
        run: |
          papermill data/final/data_collection_final.ipynb data/final/etl-output-data-collection.ipynb

      # If/when you want to run Shubham's notebook too, un-comment this:
      # - name: Run sentiment/aspects notebook
      #   run: |
      #     papermill "sent files/sent.ipynb" "sent files/etl-output-sent.ipynb"

      - name: Commit updated data
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data/final/* || true
          git commit -m "auto: refresh data $(date -u +'%Y-%m-%dT%H:%M:%SZ')" || echo "No changes to commit"
          git push
