name: Update sentiment (no notebook changes)

on:
  schedule:
    - cron: "0 14 * * *"    
  workflow_dispatch: {}

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Debug tree
        run: |
          pwd
          ls -R

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install deps (runner-side, not in notebook)
        run: |
          python -m pip install --upgrade pip
          pip install papermill jupyter nbconvert nbclient ipykernel \
                      pandas numpy python-dotenv requests \
                      vaderSentiment nltk openpyxl

      - name: Register kernel so papermill can find it
        run: |
          python -m ipykernel install --user --name python3

      - name: Pre-fetch NLTK VADER (if notebook uses it)
        run: |
          python - << 'PY'
          import nltk
          try:
            nltk.download('vader_lexicon', quiet=True)
          except Exception:
            pass
          PY

      

      - name: Create .env where the notebook expects it
        working-directory: data/final
        run: |
          # Write BOTH names in case the notebook loads either
          echo "GOOGLE_MAPS_API_KEY=${GOOGLE_MAPS_API_KEY}" > .env
          echo "GOOGLE_API_KEY=${GOOGLE_API_KEY}" >> .env
          # Show (redacted) proof
          awk -F= '{print $1"=<set>"}' .env

      - name: Run Sent.ipynb from its native folder
        working-directory: data/final
        run: |
          # Use the notebook's own relative paths by running IN that folder
          papermill --log-output -k python3 "Sent.ipynb" "_out_sent.ipynb"

      - name: Show outputs
        run: |
          ls -lh data/final

      - name: Commit updated data (if changed)
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add data/final/* || true
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "auto: refresh sentiment $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            git push
          fi
