name: Update data (notebook)

on:
  schedule:
    - cron: "0 14 * * *"
  workflow_dispatch: {}

jobs:
  run-notebook:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Option A: expose secret to all steps in this job
    env:
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: List files (debug)
        run: |
          pwd
          ls -R

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install papermill jupyter pandas numpy python-dotenv openpyxl requests

      # (Optional) keep this, but not required anymore since we set job-level env
      - name: Confirm secret is available
        run: |
          if [ -z "${GOOGLE_API_KEY}" ]; then echo "GOOGLE_API_KEY is NOT set" && exit 1; else echo "GOOGLE_API_KEY is set"; fi

      - name: Run notebook (Data collection)
        # Option B (alternative): you could put env: { GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }} } here instead of at job level
        run: |
          papermill data/final/data_collection_final.ipynb data/final/etl-output-data-collection.ipynb

      - name: Run sentiment notebook
        run: |
          papermill "data/sentiment/Sent.ipynb" "data/sentiment/etl-output-sent.ipynb"
      
      - name: Run sentiment/aspects notebook
        run: |
           papermill "data/sentiment/aspects.ipynb" "data/sentiment/etl-output-aspects.ipynb"

      - name: Commit updated data (if changed)
        run: |
         git config user.name "github-actions"
         git config user.email "actions@github.com"
         git add data/final/* || true
         git diff --cached --quiet && echo "No changes to commit" || git commit -m "auto: refresh data $(date -u +'%Y-%m-%dT%H:%M:%SZ')" 
         git push || true
